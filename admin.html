<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agenda · P&amp;F Estética</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0e0d0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Agenda P&F">
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&family=Cinzel:wght@500;600;700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f1e8; --paper:#fffdf8; --champ:#efe5d2; --champ-2:#e2d0a8;
  --gold:#c9a24a; --gold-dark:#8a6420; --gold-light:#ecd08b;
  --gold-grad:linear-gradient(135deg,#ecd08b 0%,#c9a24a 45%,#9c7428 100%);
  --black:#0e0d0b; --ink:#1b1814; --muted:#6e6458; --line:#e6dccb;
  --ok:#3f7a4f; --danger:#a3372f;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Jost,system-ui,sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
h1,h2,h3{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;margin:0;line-height:1.1}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}

/* barra superior */
.top{position:sticky;top:0;z-index:20;background:rgba(14,13,11,.96);border-bottom:1px solid rgba(201,162,74,.25);padding-top:env(safe-area-inset-top)}
.top .wrap{display:flex;align-items:center;gap:10px;height:58px}
.top img{width:38px;height:38px;border-radius:50%;box-shadow:0 0 0 1.5px var(--gold)}
.top b{font-family:Cinzel,serif;color:#f4e3b5;letter-spacing:1.5px;font-size:16px;display:block}
.top small{color:#b9a888;font-size:11px;letter-spacing:2px;text-transform:uppercase}
.top .sp{flex:1}
.icon-btn{background:rgba(201,162,74,.12);border:1px solid rgba(201,162,74,.35);color:var(--gold-light);border-radius:999px;height:36px;padding:0 14px;font-size:13.5px;font-weight:500}

/* login */
.login{min-height:100vh;display:grid;place-items:center;background:radial-gradient(90% 70% at 80% 0%,rgba(201,162,74,.2),transparent 60%),var(--black);padding:24px}
.login form{width:100%;max-width:360px;text-align:center;color:#efe6d4}
.login img{width:96px;height:96px;border-radius:50%;box-shadow:0 0 0 2px var(--gold),0 14px 40px rgba(0,0,0,.6)}
.login h1{color:#fff;font-size:34px;margin:16px 0 4px}
.login p{color:#b9a888;margin:0 0 22px}
.login input{width:100%;height:52px;border-radius:14px;border:1px solid rgba(201,162,74,.35);background:#17150f;color:#fff;padding:0 16px;margin-bottom:10px;font-size:16px}
.login input:focus{outline:none;border-color:var(--gold)}
.err{color:#e58a7f;font-size:14px;min-height:20px;margin:4px 0 8px}

.btn-gold{width:100%;height:52px;border:0;border-radius:999px;background:var(--gold-grad);color:var(--black);font-family:Cinzel,serif;font-weight:700;letter-spacing:1.5px;font-size:15px;box-shadow:0 10px 24px rgba(156,116,40,.35)}
.btn-gold:disabled{opacity:.6}
.btn-line{height:44px;border-radius:999px;border:1.5px solid var(--line);background:#fff;color:var(--ink);padding:0 16px;font-weight:500}

/* resumen */
.hello{padding:18px 0 6px}
.hello h1{font-size:30px}
.hello p{margin:2px 0 0;color:var(--muted);font-size:15px}

/* calendario */
.cal{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:14px 12px 10px;margin:12px 0;box-shadow:0 10px 28px rgba(14,13,11,.07)}
.cal-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.cal-head h2{font-size:26px;flex:1;padding-left:4px}
.nav-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:20px;color:var(--ink);display:grid;place-items:center}
.today-btn{height:36px;border-radius:999px;border:1px solid var(--champ-2);background:var(--champ);color:var(--gold-dark);padding:0 12px;font-size:13px;font-weight:600}
.dow,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow span{text-align:center;font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:1px;text-transform:uppercase;padding:4px 0}
.d{position:relative;aspect-ratio:1/1.05;border:0;border-radius:12px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink);padding:0}
.d .n{font-size:17px;font-weight:500;line-height:1}
.d .c{min-width:20px;height:18px;padding:0 5px;border-radius:9px;background:var(--gold);color:var(--black);font-size:11px;font-weight:700;display:grid;place-items:center;line-height:1}
.d .c.full{background:var(--black);color:var(--gold-light)}
.d .c.none{visibility:hidden}
.d.out{opacity:.28}
.d.closed .n{color:#b9ad9a}
.d.past .n{color:#a89d8c}
.d.today .n{color:var(--gold-dark);font-weight:700}
.d.today::after{content:"";position:absolute;inset:3px;border:1.5px solid var(--gold);border-radius:10px;pointer-events:none}
.d.sel{background:var(--black)}
.d.sel .n{color:var(--gold-light)}
.legend{display:flex;gap:14px;justify-content:center;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:14px;height:12px;border-radius:6px;background:var(--gold);vertical-align:-1px;margin-right:5px}
.legend i.k{background:var(--black)}

/* día */
.day-head{display:flex;align-items:flex-end;gap:10px;margin:22px 0 10px}
.day-head h2{font-size:28px;flex:1}
.day-head small{display:block;font-family:Jost,sans-serif;font-size:14px;color:var(--muted);font-weight:400;text-transform:none;margin-top:4px}
.closed-msg,.empty{background:var(--paper);border:1px dashed var(--champ-2);border-radius:16px;padding:22px;text-align:center;color:var(--muted)}
.empty b{display:block;font-family:"Cormorant Garamond",serif;font-size:22px;color:var(--ink);margin-bottom:4px}
.list{display:flex;flex-direction:column;gap:10px}
.turno{display:flex;gap:12px;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 6px 18px rgba(14,13,11,.05);text-align:left;width:100%;color:inherit}
.turno .hr{flex:0 0 64px;border-right:1px solid var(--line);padding-right:10px}
.turno .hr b{display:block;font-family:"Cormorant Garamond",serif;font-size:26px;line-height:1}
.turno .hr span{font-size:12.5px;color:var(--muted)}
.turno .info{flex:1;min-width:0}
.turno .info b{display:block;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.turno .info .s{color:var(--gold-dark);font-size:14px;font-weight:500}
.turno .info .o{color:var(--muted);font-size:13.5px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:2px 7px;border-radius:6px;margin-left:6px;vertical-align:2px}
.tag.web{background:#e7f0e6;color:var(--ok)}
.tag.blk{background:#eee;color:#666}
.tag.pend{background:#fbecc8;color:#8a5a00}
.tag.conf{background:#e7f0e6;color:var(--ok)}
.turno.pend{border-color:#e9c46a;box-shadow:0 0 0 2px rgba(233,196,106,.35)}
.d .c.pend{box-shadow:0 0 0 2px #fff,0 0 0 3.5px #d98b00}
.btn-confirm{display:flex;align-items:center;justify-content:center;gap:10px;height:56px;border-radius:999px;background:#25d366;color:#fff;text-decoration:none;font-weight:700;font-size:16px;margin-bottom:10px;box-shadow:0 10px 24px rgba(37,211,102,.3)}
.btn-confirm svg{width:22px;height:22px}
.conf-ok{display:flex;align-items:center;gap:8px;background:#e7f0e6;color:var(--ok);border-radius:14px;padding:10px 14px;font-weight:600;font-size:14.5px;margin-bottom:10px}
.hello .pend-note{display:inline-block;margin-top:8px;background:#fbecc8;color:#8a5a00;border-radius:999px;padding:4px 12px;font-size:13.5px;font-weight:600}
.turno.blocked{background:repeating-linear-gradient(135deg,#faf7f1 0 8px,#f2ece1 8px 16px)}
.libres{margin-top:16px;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.libres h3{font-family:Jost,sans-serif;font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:10px;height:34px;padding:0 10px;font-size:14px;font-variant-numeric:tabular-nums;color:var(--ink)}

/* botón fijo */
.fab{position:fixed;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:30;max-width:532px;margin:0 auto}

/* hoja inferior */
.sheet-bg{position:fixed;inset:0;background:rgba(14,13,11,.55);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.sheet-bg.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--paper);border-radius:24px 24px 0 0;max-height:92vh;overflow:auto;transform:translateY(105%);transition:transform .25s ease;padding:10px 18px calc(18px + env(safe-area-inset-bottom));max-width:600px;margin:0 auto}
.sheet.show{transform:none}
.grab{width:44px;height:5px;border-radius:3px;background:#d9cdb6;margin:0 auto 12px}
.sheet h2{font-size:28px}
.sheet .sub{color:var(--muted);margin:2px 0 14px}
.f{margin-bottom:12px}
.f label{display:block;font-size:13.5px;font-weight:600;margin-bottom:5px}
.f input,.f select,.f textarea{width:100%;height:50px;border:1.5px solid var(--line);border-radius:14px;background:#fff;padding:0 14px;font-size:16px;color:var(--ink)}
.f textarea{height:auto;padding:12px 14px}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--gold)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{height:46px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-size:14px;color:var(--ink);padding:0 4px}
.seg button[aria-pressed="true"]{background:var(--black);border-color:var(--black);color:var(--gold-light)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:grid;gap:8px;margin-top:6px}
.det{background:#fff;border:1px solid var(--line);border-radius:16px;padding:4px 14px;margin-bottom:12px}
.det div{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:15px}
.det div:last-child{border-bottom:0}
.det span{color:var(--muted)}
.det b{text-align:right;font-weight:500}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.quick a{height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;font-weight:600;font-size:15px}
.quick .wa{background:#25d366;color:#fff}
.quick .tel{background:var(--black);color:var(--gold-light)}
.quick svg{width:20px;height:20px}
.btn-danger{height:48px;border-radius:999px;border:1.5px solid #e4c3bf;background:#fff;color:var(--danger);font-weight:600}
.btn-danger.sure{background:var(--danger);color:#fff;border-color:var(--danger)}
.toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translateX(-50%) translateY(-20px);background:var(--black);color:var(--gold-light);padding:10px 18px;border-radius:999px;font-size:14px;z-index:60;opacity:0;transition:all .25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%)}
.loading{text-align:center;color:var(--muted);padding:30px 0}
[hidden]{display:none !important}
</style>
</head>
<body>

<!-- LOGIN -->
<section class="login" id="login-view" hidden>
  <form id="login-form" autocomplete="on">
    <img src="img/logo.png" alt="P&amp;F Estética">
    <h1>Agenda</h1>
    <p>Ingresá para ver y administrar los turnos</p>
    <input id="login-user" placeholder="Usuario" autocomplete="username" autocapitalize="none" value="administrador">
    <input id="login-pass" type="password" placeholder="Contraseña" autocomplete="current-password">
    <div class="err" id="login-error"></div>
    <button class="btn-gold" type="submit" id="login-btn">Ingresar</button>
  </form>
</section>

<!-- APP -->
<div id="app" hidden>
  <header class="top">
    <div class="wrap">
      <img src="img/logo.png" alt="">
      <div><b>P&amp;F Estética</b><small>Agenda</small></div>
      <span class="sp"></span>
      <button class="icon-btn" id="logout-btn" type="button">Salir</button>
    </div>
  </header>

  <main class="wrap">
    <div class="hello">
      <h1 id="hello-title">Hola, Fátima</h1>
      <p id="hello-sub">Cargando turnos…</p>
      <span class="pend-note" id="pend-note" hidden></span>
    </div>

    <section class="cal" aria-label="Calendario del mes">
      <div class="cal-head">
        <button class="nav-btn" id="prev-m" type="button" aria-label="Mes anterior">‹</button>
        <h2 id="month-label">—</h2>
        <button class="today-btn" id="today-btn" type="button">Hoy</button>
        <button class="nav-btn" id="next-m" type="button" aria-label="Mes siguiente">›</button>
      </div>
      <div class="dow"><span>Lun</span><span>Mar</span><span>Mié</span><span>Jue</span><span>Vie</span><span>Sáb</span><span>Dom</span></div>
      <div class="grid" id="grid"></div>
      <div class="legend"><span><i></i>con turnos</span><span><i class="k"></i>día completo</span></div>
    </section>

    <section id="day">
      <div class="day-head"><h2 id="day-title">—<small id="day-sub"></small></h2></div>
      <div id="day-body"><p class="loading">Cargando…</p></div>
    </section>
  </main>

  <div class="fab"><button class="btn-gold" id="add-btn" type="button">+ Agregar turno</button></div>
</div>

<!-- HOJAS -->
<div class="sheet-bg" id="sheet-bg"></div>

<section class="sheet" id="sheet-view" aria-modal="true" role="dialog">
  <div class="grab"></div>
  <h2 id="v-cliente">—</h2>
  <p class="sub" id="v-sub">—</p>
  <a class="btn-confirm" id="v-confirm" target="_blank" rel="noopener" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg>Confirmar y avisar por WhatsApp</a>
  <div class="conf-ok" id="v-confok" hidden>✓ Turno confirmado</div>
  <div class="quick" id="v-quick">
    <a class="wa" id="v-wa" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.2c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .1-3.3-.8-2.8-1.1-4.5-3.9-4.7-4.1-.1-.2-1.1-1.5-1.1-2.9s.7-2 1-2.3c.3-.3.6-.3.8-.3h.6c.2 0 .4 0 .6.5l.9 2.1c.1.2.1.4 0 .5l-.3.5-.4.5c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.3 2.4 1.5.3.1.5.1.6-.1l.9-1c.2-.3.4-.2.6-.1l2 1c.3.1.5.2.5.3.1.1.1.7-.1 1.3z"/></svg>WhatsApp</a>
    <a class="tel" id="v-tel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>Llamar</a>
  </div>
  <div class="det" id="v-det"></div>
  <div class="actions">
    <button class="btn-danger" id="v-delete" type="button">Cancelar este turno</button>
    <button class="btn-line" type="button" data-close>Cerrar</button>
  </div>
</section>

<section class="sheet" id="sheet-new" aria-modal="true" role="dialog">
  <div class="grab"></div>
  <h2>Nuevo turno</h2>
  <p class="sub" id="n-sub">—</p>
  <form id="new-form" novalidate>
    <div class="f">
      <label>Servicio</label>
      <div class="seg" id="n-svc">
        <button type="button" data-v="Turno" aria-pressed="true">Turno</button>
        <button type="button" data-v="Otro" aria-pressed="false">Otro servicio</button>
        <button type="button" data-v="Bloqueado" aria-pressed="false">Bloquear</button>
      </div>
    </div>
    <div id="n-lista">
      <div class="f"><label for="n-manos">Manos</label><select id="n-manos"></select></div>
      <div class="f"><label for="n-pies">Pies</label><select id="n-pies"></select></div>
    </div>
    <div class="f" id="n-otro-wrap" hidden><label for="n-otro">¿Qué servicio?</label><input id="n-otro" placeholder="Ej: Kapping + diseño"></div>
    <div id="n-client">
      <div class="f"><label for="n-cliente">Clienta</label><input id="n-cliente" autocomplete="off" placeholder="Nombre y apellido"></div>
      <div class="f"><label for="n-tel">WhatsApp</label><input id="n-tel" type="tel" inputmode="tel" placeholder="11 2345-6789"></div>
    </div>
    <div class="row2">
      <div class="f"><label for="n-dur">Duración</label>
        <select id="n-dur"><option value="30">30 min</option><option value="45">45 min</option><option value="60" selected>1 h</option><option value="75">1 h 15</option><option value="90">1 h 30</option><option value="120">2 h</option><option value="150">2 h 30</option><option value="180">3 h</option><option value="210">3 h 30</option></select>
      </div>
      <div class="f"><label for="n-hora">Hora</label><select id="n-hora"></select></div>
    </div>
    <div class="f"><label for="n-obs">Nota <span style="color:var(--muted);font-weight:400">(opcional)</span></label><input id="n-obs" placeholder="Ej: diseño francés"></div>
    <div class="err" id="n-err" style="color:var(--danger)"></div>
    <div class="actions">
      <button class="btn-gold" type="submit" id="n-save">Guardar turno</button>
      <button class="btn-line" type="button" data-close>Cancelar</button>
    </div>
  </form>
</section>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import { getFirestore, collection, query, where, onSnapshot, doc, writeBatch, updateDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCcnUVXsH_0RIdtgrQzNuA9f9yLYhvDOkg",
  authDomain: "pyfestetica-cdd45.firebaseapp.com",
  projectId: "pyfestetica-cdd45",
  storageBucket: "pyfestetica-cdd45.firebasestorage.app",
  messagingSenderId: "1093207548114",
  appId: "1:1093207548114:web:06564ed84c51b1f8f38d0b"
};
const ADMIN_USERNAME = "administrador";
const ADMIN_EMAIL = "administrador@pyfestetica.com.ar";

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

/* ---------- Horario ---------- */
const DIAS_ABIERTO = [2,3,4,5,6]; // mar a sáb
const HORARIO = {2:[["08:30","11:00"],["13:30","20:00"]],3:[["08:30","11:00"],["13:30","20:00"]],4:[["08:30","11:00"],["13:30","20:00"]],5:[["08:30","11:00"],["13:30","20:00"]],6:[["08:30","19:00"]]};
const SLOT = 30;
const toMin = h => { const [a,b] = h.split(":").map(Number); return a*60+b; };
const toH = m => String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
const iso = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const fromIso = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); };
const bloquesDe = f => HORARIO[fromIso(f).getDay()] || [];
const slotsDia = f => { const out=[]; for (const [a,b] of bloquesDe(f)) for (let m=toMin(a); m<toMin(b); m+=SLOT) out.push(toH(m)); return out; };
const slotsDe = (hora, dur) => { const out=[]; for (let m=toMin(hora); m<toMin(hora)+dur; m+=SLOT) out.push(toH(m)); return out; };
const entra = (f, hora, dur) => bloquesDe(f).some(([a,b]) => toMin(hora)>=toMin(a) && toMin(hora)+dur<=toMin(b));
const fmtDur = m => m<60 ? m+" min" : (m%60 ? Math.floor(m/60)+" h "+(m%60) : (m/60)+" h");
const $ = s => document.querySelector(s);
const cap = s => s.charAt(0).toUpperCase()+s.slice(1);
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const largo = f => { const d=fromIso(f); return d.toLocaleDateString("es-AR",{weekday:"long"})+" "+d.getDate()+" de "+MESES[d.getMonth()]; };
const esc = s => String(s??"").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const waNum = t => { let n = String(t||"").replace(/\D/g,""); if (n.startsWith("549")) return n; if (n.startsWith("54")) n = n.slice(2); n = n.replace(/^0/,""); n = n.replace(/^(\d{2,4})15/,"$1"); return "549"+n; };

/* ---------- Estado ---------- */
const hoy = new Date(); hoy.setHours(0,0,0,0);
let mes = new Date(hoy.getFullYear(), hoy.getMonth(), 1);
let sel = iso(hoy);
let turnos = {};      // id -> turno (del mes visible)
let unsub = null;
let viendo = null;
/* Enlace directo desde el correo: admin.html?f=AAAA-MM-DD&t=idTurno */
const deep = (() => { const p = new URLSearchParams(location.search); const f = p.get("f"); return /^\d{4}-\d{2}-\d{2}$/.test(f||"") ? { f, t: p.get("t") } : null; })();

function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),2200); }

/* ---------- Suscripción al mes ---------- */
function suscribir(){
  if (unsub) unsub();
  const ini = new Date(mes.getFullYear(), mes.getMonth(), 1), fin = new Date(mes.getFullYear(), mes.getMonth()+1, 0);
  // incluye la semana que asoma del mes anterior/siguiente
  const desde = new Date(ini); desde.setDate(desde.getDate()-7);
  const hasta = new Date(fin); hasta.setDate(hasta.getDate()+7);
  const q = query(collection(db,"turnos"), where("fecha",">=",iso(desde)), where("fecha","<=",iso(hasta)));
  unsub = onSnapshot(q, snap => {
    turnos = {}; snap.forEach(d => turnos[d.id] = { id:d.id, ...d.data() });
    render();
    if (deep && deep.t && turnos[deep.t]) { const id = deep.t; deep.t = null; setTimeout(()=>{ $("#day").scrollIntoView({block:"start"}); verTurno(id); },150); history.replaceState(null,"",location.pathname); }
  }, err => { console.error(err); $("#day-body").innerHTML = `<div class="empty"><b>No se pudieron cargar los turnos</b>Revisá la conexión y volvé a entrar.</div>`; });
}
const esPend = t => t.servicio!=="Bloqueado" && t.origen==="web" && t.estado!=="confirmado";
const delDia = f => Object.values(turnos).filter(t => t.fecha===f).sort((a,b)=>a.horaInicio.localeCompare(b.horaInicio));
const ocupadosDia = f => { const s=new Set(); delDia(f).forEach(t => slotsDe(t.horaInicio, t.duracionMinutos||60).forEach(h=>s.add(h))); return s; };

/* ---------- Render ---------- */
function render(){ renderHello(); renderCal(); renderDay(); }

function renderHello(){
  const h = new Date().getHours();
  $("#hello-title").textContent = (h<12?"Buen día":h<20?"Buenas tardes":"Buenas noches")+", Fátima";
  const pend = Object.values(turnos).filter(t => esPend(t) && t.fecha>=iso(hoy));
  $("#pend-note").hidden = !pend.length;
  $("#pend-note").textContent = `${pend.length} turno${pend.length>1?"s":""} de la web sin confirmar`;
  const hoyT = delDia(iso(hoy)).filter(t=>t.servicio!=="Bloqueado");
  if (!DIAS_ABIERTO.includes(hoy.getDay())) { $("#hello-sub").textContent = "Hoy no tenés turnos (domingos y lunes no atendés)."; return; }
  if (!hoyT.length) { $("#hello-sub").textContent = "Hoy no tenés turnos cargados."; return; }
  const ahora = new Date().getHours()*60+new Date().getMinutes();
  const prox = hoyT.find(t => toMin(t.horaFin||t.horaInicio) > ahora);
  $("#hello-sub").textContent = `Hoy tenés ${hoyT.length} turno${hoyT.length>1?"s":""}` + (prox ? ` · el próximo a las ${prox.horaInicio} (${prox.cliente})` : " · ya terminaron todos");
}

function renderCal(){
  $("#month-label").textContent = cap(MESES[mes.getMonth()])+" "+mes.getFullYear();
  const first = new Date(mes); const offset = (first.getDay()+6)%7; // lunes = 0
  const start = new Date(first); start.setDate(1-offset);
  let html = "";
  for (let i=0;i<42;i++){
    const d = new Date(start); d.setDate(start.getDate()+i);
    if (i>=35 && d.getMonth()!==mes.getMonth()) break;
    const f = iso(d), list = delDia(f).filter(t=>t.servicio!=="Bloqueado");
    const lleno = DIAS_ABIERTO.includes(d.getDay()) && slotsDia(f).every(h=>ocupadosDia(f).has(h));
    const cls = ["d", d.getMonth()!==mes.getMonth()?"out":"", !DIAS_ABIERTO.includes(d.getDay())?"closed":"", d<hoy?"past":"", f===iso(hoy)?"today":"", f===sel?"sel":""].join(" ");
    html += `<button type="button" class="${cls}" data-f="${f}" aria-label="${d.toLocaleDateString("es-AR",{weekday:"long",day:"numeric",month:"long"})}${list.length?`, ${list.length} turnos`:""}"><span class="n">${d.getDate()}</span><span class="c ${list.length?(lleno?"full":""):"none"} ${list.some(esPend)?"pend":""}">${list.length||0}</span></button>`;
  }
  $("#grid").innerHTML = html;
}

function renderDay(){
  const d = fromIso(sel);
  $("#day-title").firstChild.textContent = cap(largo(sel));
  const list = delDia(sel), abierto = DIAS_ABIERTO.includes(d.getDay());
  const reales = list.filter(t=>t.servicio!=="Bloqueado");
  $("#day-sub").textContent = !abierto ? "Cerrado" : reales.length ? `${reales.length} turno${reales.length>1?"s":""}` : "Sin turnos";
  let html = "";
  if (!abierto && !list.length) html = `<div class="closed-msg">Domingos y lunes no hay turnos de manos y pies.</div>`;
  else if (!list.length) html = `<div class="empty"><b>Día libre</b>No hay turnos reservados para este día.</div>`;
  else html = `<div class="list">` + list.map(t => {
    const blk = t.servicio==="Bloqueado";
    return `<button type="button" class="turno ${blk?"blocked":""} ${esPend(t)?"pend":""}" data-id="${t.id}">
      <div class="hr"><b>${esc(t.horaInicio)}</b><span>a ${esc(t.horaFin||"")}</span></div>
      <div class="info">
        <b>${blk?"Horario bloqueado":esc(t.cliente)}${esPend(t)?'<span class="tag pend">Sin confirmar</span>':(t.origen==="web"?'<span class="tag web">Web</span>':"")}</b>
        <div class="s">${blk?"":esc(t.servicio)+" · "}${fmtDur(t.duracionMinutos||60)}</div>
        ${t.comentario?`<div class="o">“${esc(t.comentario)}”</div>`:(!blk&&t.telefono?`<div class="o">${esc(t.telefono)}</div>`:"")}
      </div></button>`;
  }).join("") + `</div>`;
  if (abierto && d>=hoy) {
    const occ = ocupadosDia(sel);
    const libres = slotsDia(sel).filter(h => !occ.has(h) && !(sel===iso(hoy) && toMin(h) < new Date().getHours()*60+new Date().getMinutes()));
    html += `<div class="libres"><h3>Horarios libres (${libres.length})</h3>${libres.length?`<div class="chips">${libres.map(h=>`<button type="button" class="chip" data-h="${h}">${h}</button>`).join("")}</div>`:`<div style="color:var(--muted);font-size:14px">Día completo.</div>`}</div>`;
  }
  $("#day-body").innerHTML = html;
  $("#add-btn").hidden = !(abierto && d>=hoy);
}

/* ---------- Eventos calendario ---------- */
$("#grid").addEventListener("click", e => {
  const b = e.target.closest(".d"); if (!b) return;
  sel = b.dataset.f;
  const d = fromIso(sel);
  if (d.getMonth()!==mes.getMonth()) { mes = new Date(d.getFullYear(), d.getMonth(), 1); suscribir(); }
  render();
  setTimeout(()=>$("#day").scrollIntoView({behavior:"smooth",block:"start"}),50);
});
$("#prev-m").onclick = () => { mes = new Date(mes.getFullYear(), mes.getMonth()-1, 1); suscribir(); render(); };
$("#next-m").onclick = () => { mes = new Date(mes.getFullYear(), mes.getMonth()+1, 1); suscribir(); render(); };
$("#today-btn").onclick = () => { mes = new Date(hoy.getFullYear(), hoy.getMonth(), 1); sel = iso(hoy); suscribir(); render(); };

/* ---------- Hojas ---------- */
function abrir(id){ $("#sheet-bg").classList.add("show"); $(id).classList.add("show"); }
function cerrar(){ document.querySelectorAll(".sheet,.sheet-bg").forEach(e=>e.classList.remove("show")); resetDelete(); }
$("#sheet-bg").onclick = cerrar;
document.querySelectorAll("[data-close]").forEach(b => b.onclick = cerrar);

$("#day-body").addEventListener("click", e => {
  const t = e.target.closest(".turno"); if (t) return verTurno(t.dataset.id);
  const c = e.target.closest(".chip"); if (c) return nuevo(c.dataset.h);
});

function verTurno(id){
  const t = turnos[id]; if (!t) return; viendo = t;
  const blk = t.servicio==="Bloqueado";
  $("#v-cliente").textContent = blk ? "Horario bloqueado" : t.cliente;
  $("#v-sub").textContent = cap(largo(t.fecha)) + ` · ${t.horaInicio} a ${t.horaFin} h`;
  $("#v-quick").hidden = blk || !t.telefono;
  const msgConf = `¡Hola ${String(t.cliente).split(" ")[0]}! Tu turno de ${t.servicio} en P&F Estética quedó confirmado para el ${largo(t.fecha)} a las ${t.horaInicio} h. Te esperamos en El Salvador 1363, Tortuguitas.\n\n⏱ Te pedimos puntualidad: hay 10 minutos de tolerancia; pasado ese tiempo el turno se cancela.\nSi no podés venir, avisanos con 24 h de anticipación.\n\nCualquier consulta o duda, escribinos por acá. ¡Gracias!`;
  const pend = esPend(t);
  $("#v-confirm").hidden = !(pend && t.telefono);
  $("#v-confok").hidden = !(t.estado==="confirmado");
  if (t.telefono) $("#v-confirm").href = `https://wa.me/${waNum(t.telefono)}?text=${encodeURIComponent(msgConf)}`;
  if (t.telefono){
    $("#v-wa").href = `https://wa.me/${waNum(t.telefono)}?text=${encodeURIComponent(`¡Hola ${String(t.cliente).split(" ")[0]}! Te escribo de P&F Estética por tu turno de ${t.servicio} el ${largo(t.fecha)} a las ${t.horaInicio} h. ¡Te esperamos en El Salvador 1363, Tortuguitas!`)}`;
    $("#v-tel").href = "tel:" + String(t.telefono).replace(/[^\d+]/g,"");
  }
  const rows = blk ? [["Duración", fmtDur(t.duracionMinutos||60)], ["Nota", t.comentario||"—"]] :
    [["Servicio", t.servicio], ["Duración", fmtDur(t.duracionMinutos||60)], ["WhatsApp", t.telefono||"—"], ["Comentario", t.comentario||"—"], ["Reservado", t.origen==="web" ? "Desde la web" : "Cargado en la agenda"], ["Estado", t.origen!=="web" || t.estado==="confirmado" ? "Confirmado" : "Sin confirmar"]];
  $("#v-det").innerHTML = rows.map(([a,b])=>`<div><span>${a}</span><b>${esc(b)}</b></div>`).join("");
  $("#v-delete").textContent = blk ? "Desbloquear horario" : "Cancelar este turno";
  abrir("#sheet-view");
}

$("#v-confirm").addEventListener("click", () => {
  // el enlace abre WhatsApp; en paralelo marcamos el turno como confirmado
  const t = viendo; if (!t) return;
  updateDoc(doc(db,"turnos",t.id), { estado:"confirmado", confirmado:new Date().toISOString() })
    .then(() => { toast("Turno confirmado"); setTimeout(cerrar, 300); })
    .catch(err => { console.error(err); toast("No se pudo marcar como confirmado"); });
});

let armado = false;
function resetDelete(){ armado=false; const b=$("#v-delete"); b.classList.remove("sure"); if (viendo) b.textContent = viendo.servicio==="Bloqueado" ? "Desbloquear horario" : "Cancelar este turno"; }
$("#v-delete").onclick = async () => {
  const b = $("#v-delete");
  if (!armado) { armado = true; b.classList.add("sure"); b.textContent = "Tocá de nuevo para confirmar"; setTimeout(()=>{ if(armado) resetDelete(); }, 4000); return; }
  const t = viendo; b.disabled = true;
  try {
    const batch = writeBatch(db);
    batch.delete(doc(db,"turnos",t.id));
    for (const h of slotsDe(t.horaInicio, t.duracionMinutos||60)) batch.delete(doc(db,"disponibilidad",`${t.fecha}_${h}`));
    await batch.commit();
    cerrar(); toast(t.servicio==="Bloqueado" ? "Horario desbloqueado" : "Turno cancelado");
  } catch (err) { console.error(err); toast("No se pudo cancelar. Probá de nuevo."); }
  b.disabled = false;
};

/* ---------- Nuevo turno ---------- */
const SERVICIOS = [
  {cat:"manos", nombre:"Manicuría simple", dur:45},
  {cat:"manos", nombre:"Esmaltado semipermanente", dur:60},
  {cat:"manos", nombre:"Capping", dur:120},
  {cat:"manos", nombre:"Soft gel (tips)", dur:120},
  {cat:"pies", nombre:"Belleza de pies", dur:45},
  {cat:"pies", nombre:"Belleza de pies con semi", dur:50},
  {cat:"pies", nombre:"Pedicuría simple", dur:75},
  {cat:"pies", nombre:"Pedicuría completa con semi", dur:90}
];
for (const c of ["manos","pies"]) $("#n-"+c).innerHTML = `<option value="">— Ninguno —</option>` + SERVICIOS.filter(s=>s.cat===c).map(s=>`<option value="${s.nombre}" data-d="${s.dur}">${s.nombre} · ${fmtDur(s.dur)}</option>`).join("");
let nSvc = { v:"Turno" };
function setDur(m){
  const sel = $("#n-dur");
  if (![...sel.options].some(o=>Number(o.value)===m)) { const o=document.createElement("option"); o.value=m; o.textContent=fmtDur(m); sel.add(o); [...sel.options].sort((a,b)=>a.value-b.value).forEach(x=>sel.add(x)); }
  sel.value = String(m);
}
function durElegida(){ return ["manos","pies"].reduce((a,c)=>{ const o=$("#n-"+c).selectedOptions[0]; return a + (o && o.value ? Number(o.dataset.d) : 0); },0); }
function servicioElegido(){ return ["manos","pies"].map(c=>$("#n-"+c).value).filter(Boolean).join(" + "); }
function horasPosibles(dur){
  const occ = ocupadosDia(sel); const ahora = new Date().getHours()*60+new Date().getMinutes();
  return slotsDia(sel).filter(h => entra(sel,h,dur) && slotsDe(h,dur).every(x=>!occ.has(x)) && !(sel===iso(hoy) && toMin(h)<ahora));
}
function llenarHoras(pref){
  const dur = Number($("#n-dur").value); const hs = horasPosibles(dur);
  $("#n-hora").innerHTML = hs.length ? hs.map(h=>`<option ${h===pref?"selected":""}>${h}</option>`).join("") : `<option value="">Sin lugar</option>`;
}
function nuevo(hora){
  $("#new-form").reset(); $("#n-err").textContent = "";
  setSvc($("#n-svc button")); setDur(60);
  $("#n-sub").textContent = cap(largo(sel));
  llenarHoras(hora);
  abrir("#sheet-new");
}
function setSvc(btn){
  document.querySelectorAll("#n-svc button").forEach(b=>b.setAttribute("aria-pressed", b===btn));
  nSvc = { v:btn.dataset.v };
  if (nSvc.v!=="Turno") setDur(60); else if (durElegida()) setDur(durElegida());
  $("#n-otro-wrap").hidden = nSvc.v!=="Otro";
  $("#n-lista").hidden = nSvc.v!=="Turno";
  $("#n-client").hidden = nSvc.v==="Bloqueado";
  llenarHoras($("#n-hora").value);
}
$("#n-svc").addEventListener("click", e => { const b=e.target.closest("button"); if (b) setSvc(b); });
$("#n-dur").addEventListener("change", () => llenarHoras($("#n-hora").value));
["manos","pies"].forEach(c => $("#n-"+c).addEventListener("change", () => { const d=durElegida(); if (d) setDur(d); llenarHoras($("#n-hora").value); }));
$("#add-btn").onclick = () => nuevo();

$("#new-form").addEventListener("submit", async e => {
  e.preventDefault();
  const err = $("#n-err"); err.textContent = "";
  const blk = nSvc.v==="Bloqueado";
  const cliente = blk ? "Bloqueado" : $("#n-cliente").value.trim();
  const telefono = blk ? "" : $("#n-tel").value.trim();
  const servicio = nSvc.v==="Otro" ? ($("#n-otro").value.trim() || "Otro") : nSvc.v==="Bloqueado" ? "Bloqueado" : servicioElegido();
  if (nSvc.v==="Turno" && !servicio) { err.textContent = "Elegí un servicio de manos o de pies."; return; }
  const dur = Number($("#n-dur").value), hora = $("#n-hora").value;
  if (!blk && cliente.length < 2) { err.textContent = "Escribí el nombre de la clienta."; return; }
  if (!hora) { err.textContent = "No hay lugar para esa duración ese día."; return; }
  const slots = slotsDe(hora, dur); const occ = ocupadosDia(sel);
  if (slots.some(h=>occ.has(h))) { err.textContent = "Ese horario se superpone con otro turno."; return; }
  const btn = $("#n-save"); btn.disabled = true;
  try {
    const batch = writeBatch(db);
    const ref = doc(collection(db,"turnos"));
    batch.set(ref, { fecha:sel, horaInicio:hora, horaFin:toH(toMin(hora)+dur), cliente, telefono, servicio, duracionMinutos:dur, comentario:$("#n-obs").value.trim(), creado:new Date().toISOString(), origen:"agenda" });
    for (const h of slots) batch.set(doc(db,"disponibilidad",`${sel}_${h}`), { fecha:sel, hora:h, ocupado:true, turnoId:ref.id });
    await batch.commit();
    cerrar(); toast(blk ? "Horario bloqueado" : "Turno guardado");
  } catch (e2) { console.error(e2); err.textContent = "No se pudo guardar. Probá de nuevo."; }
  btn.disabled = false;
});

/* ---------- Login ---------- */
$("#login-form").addEventListener("submit", async e => {
  e.preventDefault();
  const errEl = $("#login-error"); errEl.textContent = "";
  const user = $("#login-user").value.trim().toLowerCase();
  if (user !== ADMIN_USERNAME) { errEl.textContent = "Usuario incorrecto."; return; }
  $("#login-btn").disabled = true;
  try { await signInWithEmailAndPassword(auth, ADMIN_EMAIL, $("#login-pass").value); }
  catch { errEl.textContent = "Usuario o contraseña incorrectos."; }
  $("#login-btn").disabled = false;
});
$("#logout-btn").onclick = () => signOut(auth);

onAuthStateChanged(auth, user => {
  $("#login-view").hidden = !!user;
  $("#app").hidden = !user;
  if (user) {
    if (deep && deep.f) { sel = deep.f; const d = fromIso(sel); mes = new Date(d.getFullYear(), d.getMonth(), 1); if (!deep.t) { history.replaceState(null,"",location.pathname); setTimeout(()=>$("#day").scrollIntoView({block:"start"}),300); } }
    suscribir(); render();
  }
  else if (unsub) { unsub(); unsub = null; }
});
setInterval(() => { if (!$("#app").hidden) renderHello(); }, 60000);
</script>
